[project]
name = "jobjournal"
version = "0.1.0"
description = "Job application tracking API"
requires-python = ">=3.14"
dependencies = [
    "asgiref==3.12.1",
    "attrs==26.1.0",
    "boto3>=1.43.62",
    "botocore>=1.43.62",
    "django==6.0.7",
    "django-simple-history==3.13.0",
    "django-storages==1.14.6",
    "djangorestframework==3.17.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "h11>=0.16.0",
    "h2>=4.4.0",
    "hpack>=4.2.0",
    "hypercorn>=0.18.0",
    "hyperframe>=6.1.0",
    "inflection==0.5.1",
    "jmespath>=1.1.0",
    "jsonschema==4.26.0",
    "jsonschema-specifications==2025.9.1",
    "pip>=26.2",
    "priority>=2.0.0",
    "pyjwt==2.13.0",
    "python-dateutil>=2.9.0.post0",
    "pyyaml==6.0.3",
    "referencing==0.37.0",
    "rpds-py==2026.6.3",
    "s3transfer>=0.19.2",
    "six>=1.17.0",
    "sqlparse==0.5.5",
    "uritemplate==4.2.0",
    "urllib3>=2.7.0",
    "wsproto>=1.3.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = false
